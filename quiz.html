<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>
</head>
<body>

    <h2>👤 {{ name }}, solve this:</h2>

    <h1>{{ question }}</h1>

    <form action="/submit_quiz" method="POST">
        
        <!-- keep student name -->
        <input type="hidden" name="name" value="{{ name }}">

        <!-- correct answer (hidden) -->
        <input type="hidden" name="correct" value="{{ answer }}">

        <!-- user input -->
        <input type="number" name="answer" placeholder="Your answer" required>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
