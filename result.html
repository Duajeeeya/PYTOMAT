<!DOCTYPE html>
<html>
<head>
    <title>Results</title>
</head>
<body>

    <h1>📊 Quiz Results</h1>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Score</th>
        </tr>

        {% for s in scores %}
        <tr>
            <td>{{ s.name }}</td>
            <td>{{ s.score }}</td>
        </tr>
        {% endfor %}

    </table>

    <br>

    <a href="/">🔁 Try Again</a>

</body>
</html>
